    <script>
        ; (() => {
            const storageKey = "portfolio-theme"
            let storedTheme = null

            try {
                storedTheme = localStorage.getItem(storageKey)
            } catch (_) {
                storedTheme = null
            }

            const prefersDark =
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches

            const initialTheme =
                storedTheme === "dark" || storedTheme === "light"
                    ? storedTheme
                    : prefersDark
                        ? "dark"
                        : "light"

            document.documentElement.dataset.theme = initialTheme
        })()
    </script>

                        ink: "rgb(var(--ink) / <alpha-value>)",
                        midnight: "rgb(var(--midnight) / <alpha-value>)",
                        muted: "rgb(var(--muted) / <alpha-value>)",
                        line: "rgb(var(--line) / <alpha-value>)",
                        surface: "rgb(var(--surface) / <alpha-value>)",
                    },
                    fontFamily: {
                        display: ["Poppins", "sans-serif"],
                    },
                    boxShadow: {
                        soft: "0 15px 40px rgba(17, 27, 55, 0.1)",

        }

    <style>
        :root {
            --paper: 238 239 240;
            --ink: 17 27 55;
            --midnight: 0 15 55;
            --muted: 102 119 144;
            --line: 182 188 199;
            --surface: 255 255 255;
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --paper: 10 18 39;
            --ink: 230 237 255;
            --midnight: 4 10 28;
            --muted: 154 170 200;
            --line: 67 82 111;
            --surface: 20 31 56;
            color-scheme: dark;
        }

        html {
            scroll-behavior: smooth;
        }

        .fade-up {
            opacity: 0;
            transform: translateY(24px);
            animation: fadeUp 0.8s ease forwards;
        }

        .fade-up-delay-1 {
            animation-delay: 0.15s;
        }

        .fade-up-delay-2 {
            animation-delay: 0.25s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

    <script>
        const themeStorageKey = "portfolio-theme"
        const themePreferenceQuery = window.matchMedia
            ? window.matchMedia("(prefers-color-scheme: dark)")
            : null

        let activeTheme =
            document.documentElement.dataset.theme === "dark" ? "dark" : "light"

        function readStoredTheme() {
            try {
                const stored = localStorage.getItem(themeStorageKey)
                return stored === "dark" || stored === "light" ? stored : null
            } catch (_) {
                return null
            }
        }

        function saveTheme(theme) {
            try {
                localStorage.setItem(themeStorageKey, theme)
            } catch (_) {
                // Skip persistence when storage is unavailable.
            }
        }

        function updateThemeToggleUi() {
            const toggleButton = document.getElementById("theme-toggle")
            if (!toggleButton) return

            const icon = document.getElementById("theme-toggle-icon")
            const label = document.getElementById("theme-toggle-text")
            const isDark = activeTheme === "dark"

            toggleButton.setAttribute(
                "aria-label",
                isDark ? "Switch to light mode" : "Switch to dark mode",
            )
            toggleButton.setAttribute("aria-pressed", String(isDark))

            if (icon) {
                icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon"
            }

            if (label) {
                label.textContent = isDark ? "Light" : "Dark"
            }
        }

        function applyTheme(theme) {
            activeTheme = theme === "dark" ? "dark" : "light"
            document.documentElement.dataset.theme = activeTheme
            updateThemeToggleUi()
        }

        function initThemeToggle() {
            const toggleButton = document.getElementById("theme-toggle")
            if (!toggleButton) return

            updateThemeToggleUi()

            toggleButton.addEventListener("click", () => {
                const nextTheme = activeTheme === "dark" ? "light" : "dark"
                applyTheme(nextTheme)
                saveTheme(nextTheme)
            })

            if (!themePreferenceQuery || readStoredTheme()) return

            const syncWithSystemPreference = (event) => {
                applyTheme(event.matches ? "dark" : "light")
            }

            if (typeof themePreferenceQuery.addEventListener === "function") {
                themePreferenceQuery.addEventListener("change", syncWithSystemPreference)
            } else if (typeof themePreferenceQuery.addListener === "function") {
                themePreferenceQuery.addListener(syncWithSystemPreference)
            }
        }

        function initMobileNav() {
            const toggleButton = document.getElementById("mobile-menu-toggle")
            const menu = document.getElementById("mobile-menu")
            if (!toggleButton || !menu) return

            toggleButton.addEventListener("click", () => {
                menu.classList.toggle("hidden")
            })

            menu.querySelectorAll("a").forEach((link) => {
                link.addEventListener("click", () => {
                    menu.classList.add("hidden")
                })
            })
        }

        function animateCounters() {
            const counters = document.querySelectorAll(".stat-number")
            if (!counters.length) return

            counters.forEach((counter) => {
                const target = Number(counter.dataset.target)
                const duration = 1400
                const start = performance.now()

                function tick(now) {
                    const progress = Math.min((now - start) / duration, 1)
                    const eased = 1 - Math.pow(1 - progress, 3)
                    const value = Math.floor(eased * target)

                    counter.textContent = value
                    if (progress < 1) {
                        requestAnimationFrame(tick)
                    } else {
                        counter.textContent = target
                    }
                }

                requestAnimationFrame(tick)
            })
        }

        function createProjectCard(project) {
            const article = document.createElement("article")
            const isWide = project.size === "wide"

            article.className = [
                "group relative overflow-hidden rounded-none border border-white/15 bg-white/5",
                isWide ? "md:col-span-2" : "",
            ].join(" ")

            const ratioClass = isWide ? "aspect-[2.4/1]" : "aspect-[4/3]"
            const categoryLabel = project.category.replace("-", " ")

            article.innerHTML = `
                <div class="${ratioClass} w-full overflow-hidden">
                    <img
                        src="${project.image}"
                        alt="${project.title} preview"
                        class="h-full w-full object-cover transition duration-700 group-hover:scale-105"
                    />
                </div>
                <div class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 to-transparent p-5 md:p-6">
                    <p class="text-sm text-white/80">${categoryLabel} | ${project.year}</p>
                    <h3 class="mt-2 text-xl font-medium text-white md:text-3xl">${project.title}</h3>
                </div>
            `

            return article
        }

        function normalizeFilterKey(value) {
            return String(value ?? "")
                .trim()
                .toLowerCase()
                .replace(/[\s_]+/g, "-")
        }

        function toTitleCaseFromKey(value) {
            return String(value ?? "")
                .replace(/[-_]+/g, " ")
                .replace(/\b\w/g, (char) => char.toUpperCase())
        }

        function getProjectFilterKeys(project) {
            const keys = []
            if (project?.category) keys.push(normalizeFilterKey(project.category))

            if (Array.isArray(project?.skills)) {
                project.skills.forEach((skill) => {
                    keys.push(normalizeFilterKey(skill))
                })
            }

            return [...new Set(keys)]
        }

        function initProjects() {
            const grid = document.getElementById("projects-grid")
            const filters = document.getElementById("project-filters")
            if (!grid || !filters) return

            let currentFilter = "all"

            function buildFilterButtons() {
                const allKeys = new Set()
                projectItems.forEach((item) => {
                    getProjectFilterKeys(item).forEach((key) => allKeys.add(key))
                })

                const categoryKeys = []
                const skillKeys = []
                allKeys.forEach((key) => {
                    const isCategory = projectItems.some(
                        (item) => normalizeFilterKey(item.category) === key,
                    )
                    if (isCategory) {
                        categoryKeys.push(key)
                    } else {
                        skillKeys.push(key)
                    }
                })

                const orderedKeys = [...categoryKeys.sort(), ...skillKeys.sort()]
                const buttonDefs = [
                    { key: "all", label: "All Works" },
                    ...orderedKeys.map((key) => ({ key, label: toTitleCaseFromKey(key) })),
                ]

                filters.innerHTML = ""
                buttonDefs.forEach(({ key, label }) => {
                    const button = document.createElement("button")
                    button.type = "button"
                    button.dataset.filter = key
                    button.textContent = label
                    filters.appendChild(button)
                })
            }

            function setActiveButton() {
                filters.querySelectorAll("button").forEach((button) => {
                    const buttonFilter = normalizeFilterKey(
                        button.dataset.filter || button.textContent,
                    )
                    const isActive = buttonFilter === currentFilter
                    button.className = [
                        "rounded-full px-5 py-2 text-sm font-semibold transition md:text-base",
                        isActive
                            ? "bg-surface text-ink"
                            : "text-white/45 hover:text-white",
                    ].join(" ")
                })
            }

            function render() {
                const visibleItems =
                    currentFilter === "all"
                        ? projectItems
                        : projectItems.filter((item) =>
                            getProjectFilterKeys(item).includes(currentFilter),
                        )

                grid.innerHTML = ""
                visibleItems.forEach((item) => {
                    grid.appendChild(createProjectCard(item))
                })
            }

            filters.addEventListener("click", (event) => {
                const button = event.target.closest("button")
                if (!button) return
                const nextFilter = button.dataset.filter || button.textContent
                currentFilter = normalizeFilterKey(nextFilter)
                setActiveButton()
                render()
            })

            buildFilterButtons()
            setActiveButton()
            render()
        }

        async function loadSections() {
            const loadTasks = Object.entries(sectionFiles).map(async ([id, file]) => {
                const response = await fetch(file)
                const html = await response.text()
                const mount = document.getElementById(id)
                if (mount) mount.innerHTML = html
            })

            await Promise.all(loadTasks)
            initThemeToggle()
            initMobileNav()
            initProjects()
            animateCounters()
        }

        loadSections().catch((error) => {
            console.error("Failed to load sections", error)
        })
    </script>
